<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: -9999px; /* Mantém o iframe carregado e ativo, mas fora da visão */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
        }

        /* Quando ativo, volta para a tela e exibe com fade suave */
        iframe.ativo { 
            left: 0; 
            opacity: 1; 
            pointer-events: auto; 
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- Cole o Link de PRESENTES entre as aspas abaixo -->
        <iframe id="linkA" class="ativo" src="http://overlay.gobubbly.app:3000/leaderboards?board=gifters"></iframe>
        
        <!-- Cole o Link de CURTIDAS entre as aspas abaixo -->
        <iframe id="linkB" src="http://overlay.gobubbly.app:3000/leaderboards?board=likes"></iframe>
    </div>

    <script>
        const tempoPresentes = 5000; // Tempo na tela: 5 segundos
        const tempoCurtidas = 8000;  // Tempo na tela: 8 segundos

        const frameA = document.getElementById('linkA');
        const frameB = document.getElementById('linkB');

        function alternarRankings() {
            if (frameA.classList.contains('ativo')) {
                frameA.classList.remove('ativo');
                frameB.classList.add('ativo');
                setTimeout(alternarRankings, tempoCurtidas);
            } else {
                frameB.classList.remove('ativo');
                frameA.classList.add('ativo');
                setTimeout(alternarRankings, tempoPresentes);
            }
        }

        setTimeout(alternarRankings, tempoPresentes);
    </script>
</body>
</html>
